<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Для тебя ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: opacity 1s ease, transform 1s ease;
        }

        /* ПЕРВЫЙ ЭКРАН */

        #screen1 {
            opacity: 1;
            transform: scale(1);
        }

        #screen1.hide {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .content {
            text-align: center;
            color: white;
            z-index: 10;
            padding: 20px;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: appear 2s ease;
        }

        .subtitle {
            margin-top: 15px;
            font-size: 20px;
        }

        .button {
            margin-top: 35px;
            padding: 14px 30px;

            border: none;
            border-radius: 30px;

            background: rgba(255,255,255,0.9);
            color: #ff6f91;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

            transition: transform 0.2s;
        }

        .button:active {
            transform: scale(0.9);
        }


        /* ВТОРОЙ ЭКРАН */

        #screen2 {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        #screen2.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .message {
            max-width: 700px;
            padding: 30px;
            text-align: center;
            color: white;
        }

        .message h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .message p {
            font-size: 21px;
            line-height: 1.6;
        }


        /* СЕРДЕЧКИ */

        .heart {
            position: absolute;
            bottom: -50px;

            animation: fly linear forwards;

            opacity: 0.8;
        }

        @keyframes fly {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        @media (max-width: 600px) {

            .title {
                font-size: 34px;
            }

            .subtitle {
                font-size: 18px;
            }

            .message h1 {
                font-size: 30px;
            }

            .message p {
                font-size: 18px;
            }

        }

    </style>
</head>

<body>


<!-- ПЕРВЫЙ ЭКРАН -->

<div class="screen" id="screen1">

    <div class="content">

        <div class="title">
            Для тебя ❤️
        </div>

        <div class="subtitle">
            Есть кое-что важное...
        </div>

        <button class="button" onclick="nextScreen()">
            Открыть 💗
        </button>

    </div>

</div>


<!-- ВТОРОЙ ЭКРАН -->

<div class="screen" id="screen2">

    <div class="message">

        <h1>
            Ты самая красивая девочака в мире❤️)
        </h1>

        <p>
  
        </p>

    </div>

</div>


<script>

    /* ПЕРЕХОД НА ВТОРОЙ ЭКРАН */

    function nextScreen() {

        document.getElementById("screen1").classList.add("hide");

        setTimeout(() => {

            document.getElementById("screen2").classList.add("show");

        }, 500);

    }


    /* СОЗДАНИЕ СЕРДЕЧЕК */

    function createHeart() {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            Math.random() > 0.5 ? "❤️" : "💕";

        heart.style.left =
            Math.random() * 100 + "vw";

        const size =
            15 + Math.random() * 25;

        heart.style.fontSize =
            size + "px";

        const duration =
            5 + Math.random() * 6;

        heart.style.animationDuration =
            duration + "s";

        document.body.appendChild(heart);

        setTimeout(() => {

            heart.remove();

        }, duration * 1000);

    }


    setInterval(createHeart, 350);

</script>

</body>
</html
