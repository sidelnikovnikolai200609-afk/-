<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>I ❤️ YOU</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Georgia, serif;
}

canvas {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}


/* =========================
   ТЕКСТ
========================= */

.text {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    color: white;

    pointer-events: none;

    z-index: 10;

    opacity: 0;

    transition:
        opacity 1.5s ease;
}


.title {

    font-size: clamp(
        16px,
        4vw,
        28px
    );

    letter-spacing: 5px;

    text-shadow:
        0 0 5px white,
        0 0 10px #ff3355,
        0 0 20px #ff0033,
        0 0 35px #ff0033;
}


.subtitle {

    margin-top: 10px;

    font-size: clamp(
        6px,
        1.5vw,
        10px
    );

    letter-spacing: 4px;

    opacity: 0.85;
}

</style>
</head>

<body>

<div class="text">

    <div class="title">
        YOU &amp; ME
    </div>

    <div class="subtitle">
        WRITTEN IN THE STARS
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   ОСНОВНЫЕ НАСТРОЙКИ
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );


camera.position.z = 7;


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   НАСТРОЙКИ ЧАСТИЦ
===================================================== */

const PARTICLE_COUNT = 6500;


/*
   Каждая частица имеет:

   current
   - текущее положение

   target
   - положение на сердце

   start
   - начальное положение
*/


const current =
    new Float32Array(
        PARTICLE_COUNT * 3
    );


const target =
    new Float32Array(
        PARTICLE_COUNT * 3
    );


const start =
    new Float32Array(
        PARTICLE_COUNT * 3
    );


/* =====================================================
   СОЗДАЁМ ФОРМУ СЕРДЦА
===================================================== */


/*
   Используем классическую
   математическую формулу сердца:

   x = 16 sin³(t)

   y =
   13 cos(t)
   - 5 cos(2t)
   - 2 cos(3t)
   - cos(4t)
*/


for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
) {

    const index = i * 3;


    /*
       Случайная точка
       вокруг сердца.
    */

    const t =
        Math.random() *
        Math.PI * 2;


    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        13 *
        Math.cos(t)
        - 5 *
        Math.cos(2 * t)
        - 2 *
        Math.cos(3 * t)
        - Math.cos(4 * t);


    /*
       Масштабирование
    */

    const scale = 0.19;


    target[index] =
        x * scale;


    target[index + 1] =
        y * scale;


    /*
       Небольшая глубина.
    */

    target[index + 2] =
        (Math.random() - 0.5) *
        0.18;


    /*
       Начальная позиция —
       частицы разбросаны
       вокруг экрана.
    */

    const radius =
        2.5 +
        Math.random() * 4;


    const angle =
        Math.random() *
        Math.PI * 2;


    start[index] =
        Math.cos(angle) *
        radius;


    start[index + 1] =
        Math.sin(angle) *
        radius;


    start[index + 2] =
        (Math.random() - 0.5) *
        5;


    current[index] =
        start[index];


    current[index + 1] =
        start[index + 1];


    current[index + 2] =
        start[index + 2];
}


/* =====================================================
   GEOMETRY
===================================================== */

const heartGeometry =
    new THREE.BufferGeometry();


heartGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        current,
        3
    )
);


/* =====================================================
   МАТЕРИАЛ ЧАСТИЦ
===================================================== */

const heartMaterial =
    new THREE.PointsMaterial({

        color: 0xff3155,

        size: 0.028,

        transparent: true,

        opacity: 0.95,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });


const heart =
    new THREE.Points(
        heartGeometry,
        heartMaterial
    );


scene.add(heart);


/* =====================================================
   ДОПОЛНИТЕЛЬНОЕ СВЕЧЕНИЕ
===================================================== */

const glowGeometry =
    new THREE.BufferGeometry();


const glowPositions =
    new Float32Array(
        1200 * 3
    );


for (
    let i = 0;
    i < 1200;
    i++
) {

    const index = i * 3;

    glowPositions[index] =
        (Math.random() - 0.5) *
        5;

    glowPositions[index + 1] =
        (Math.random() - 0.5) *
        4;

    glowPositions[index + 2] =
        (Math.random() - 0.5) *
        1.5;
}


glowGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        glowPositions,
        3
    )
);


const glowMaterial =
    new THREE.PointsMaterial({

        color: 0xff1744,

        size: 0.018,

        transparent: true,

        opacity: 0.2,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });


const glow =
    new THREE.Points(
        glowGeometry,
        glowMaterial
    );


scene.add(glow);


/* =====================================================
   ЗВЁЗДЫ НА ЗАДНЕМ ПЛАНЕ
===================================================== */

const STAR_COUNT = 1800;


const starPositions =
    new Float32Array(
        STAR_COUNT * 3
    );


for (
    let i = 0;
    i < STAR_COUNT;
    i++
) {

    const index = i * 3;


    starPositions[index] =
        (Math.random() - 0.5) *
        18;


    starPositions[index + 1] =
        (Math.random() - 0.5) *
        13;


    starPositions[index + 2] =
        (Math.random() - 0.5) *
        10;
}


const starGeometry =
    new THREE.BufferGeometry();


starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);


const starMaterial =
    new THREE.PointsMaterial({

        color: 0xffffff,

        size: 0.012,

        transparent: true,

        opacity: 0.7
    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );


scene.add(stars);


/* =====================================================
   ЛЕТЯЩИЕ РОЗОВЫЕ ЧАСТИЦЫ
===================================================== */

const FLY_COUNT = 130;


const flyPositions =
    new Float32Array(
        FLY_COUNT * 3
    );


for (
    let i = 0;
    i < FLY_COUNT;
    i++
) {

    const index = i * 3;


    flyPositions[index] =
        (Math.random() - 0.5) *
        12;


    flyPositions[index + 1] =
        (Math.random() - 0.5) *
        9;


    flyPositions[index + 2] =
        (Math.random() - 0.5) *
        5;
}


const flyGeometry =
    new THREE.BufferGeometry();


flyGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        flyPositions,
        3
    )
);


const flyMaterial =
    new THREE.PointsMaterial({

        color: 0xff416c,

        size: 0.035,

        transparent: true,

        opacity: 0.8,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });


const flying =
    new THREE.Points(
        flyGeometry,
        flyMaterial
    );


scene.add(flying);


/* =====================================================
   ВРЕМЯ
===================================================== */

const clock =
    new THREE.Clock();


/*
   Состояния:

   0 = разлёт частиц

   1 = сборка сердца

   2 = сердцебиение
*/

let state = 0;

let stateTime = 0;


/* =====================================================
   ПЛАВНАЯ ФУНКЦИЯ
===================================================== */

function easeInOut(t) {

    return t * t *
        (3 - 2 * t);
}


/* =====================================================
   СБОРКА СЕРДЦА
===================================================== */

function assembleHeart(progress) {

    progress =
        Math.min(
            1,
            Math.max(
                0,
                progress
            )
        );


    const smooth =
        easeInOut(progress);


    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        const index = i * 3;


        /*
           От начальной позиции
           к форме сердца.
        */

        current[index] =
            start[index] +
            (
                target[index] -
                start[index]
            ) *
            smooth;


        current[index + 1] =
            start[index + 1] +
            (
                target[index + 1] -
                start[index + 1]
            ) *
            smooth;


        current[index + 2] =
            start[index + 2] +
            (
                target[index + 2] -
                start[index + 2]
            ) *
            smooth;
    }


    heartGeometry
        .attributes
        .position
        .needsUpdate = true;
}


/* =====================================================
   СЕРДЦЕБИЕНИЕ
===================================================== */


/*
   Главное отличие от обычной
   синусоидальной пульсации.

   Настоящее сердцебиение:

       удар
       пауза
       второй удар
       пауза

   Поэтому используем два
   последовательных импульса.
*/


function heartbeat(time) {

    /*
       Частота цикла.
    */

    const cycle =
        time % 1.25;


    let beat = 0;


    /*
       Первый удар
    */

    if (cycle < 0.16) {

        const p =
            cycle / 0.16;

        beat =
            Math.sin(
                p * Math.PI
            );

    }


    /*
       Второй удар
    */

    else if (
        cycle >= 0.22 &&
        cycle < 0.38
    ) {

        const p =
            (
                cycle - 0.22
            ) / 0.16;

        beat =
            Math.sin(
                p * Math.PI
            ) * 0.65;
    }


    /*
       Масштаб сердца.
    */

    const scale =
        1 +
        beat * 0.09;


    heart.scale.set(
        scale,
        scale,
        scale
    );


    /*
       Дополнительное
       усиление свечения.
    */

    heartMaterial.opacity =
        0.78 +
        beat * 0.22;


    glowMaterial.opacity =
        0.12 +
        beat * 0.2;
}


/* =====================================================
   АНИМАЦИЯ
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    const time =
        clock.getElapsedTime();


    stateTime += delta;


    /* =================================
       СТАДИЯ 1
       ЧАСТИЦЫ РАЗЛЕТАЮТСЯ
    ================================= */

    if (state === 0) {

        /*
           Немного хаотического
           движения.
        */

        for (
            let i = 0;
            i < PARTICLE_COUNT;
            i++
        ) {

            const index = i * 3;


            current[index] +=
                Math.sin(
                    time * 2 + i
                ) * 0.002;


            current[index + 1] +=
                Math.cos(
                    time * 1.7 + i
                ) * 0.002;
        }


        heartGeometry
            .attributes
            .position
            .needsUpdate = true;


        /*
           Через 1.4 секунды
           начинаем сборку.
        */

        if (stateTime > 1.4) {

            state = 1;

            stateTime = 0;
        }
    }


    /* =================================
       СТАДИЯ 2
       СБОРКА СЕРДЦА
    ================================= */

    else if (state === 1) {

        const progress =
            stateTime / 3.0;


        assembleHeart(
            progress
        );


        /*
           После полной сборки
           начинаем сердцебиение.
        */

        if (progress >= 1) {

            state = 2;

            stateTime = 0;


            /*
               Показываем текст.
            */

            document
                .querySelector(".text")
                .style.opacity = "1";
        }
    }


    /* =================================
       СТАДИЯ 3
       СЕРДЦЕБИЕНИЕ
    ================================= */

    else if (state === 2) {

        heartbeat(
            stateTime
        );


        /*
           Очень лёгкое вращение.
        */

        heart.rotation.z =
            Math.sin(
                time * 0.3
            ) * 0.015;


        heart.rotation.y =
            Math.sin(
                time * 0.4
            ) * 0.025;
    }


    /* =================================
       ЗВЁЗДЫ
    ================================= */

    stars.rotation.y =
        time * 0.008;


    stars.rotation.x =
        Math.sin(
            time * 0.1
        ) * 0.02;


    /* =================================
       ЛЕТЯЩИЕ ЧАСТИЦЫ
    ================================= */

    const fly =
        flyGeometry
            .attributes
            .position
            .array;


    for (
        let i = 0;
        i < FLY_COUNT;
        i++
    ) {

        const index = i * 3;


        /*
           Движение вверх.
        */

        fly[index + 1] +=
            0.006;


        /*
           Небольшое движение
           в стороны.
        */

        fly[index] +=
            Math.sin(
                time + i
            ) * 0.001;


        /*
           Если улетела —
           возвращаем вниз.
        */

        if (
            fly[index + 1] > 5
        ) {

            fly[index + 1] =
                -5;

            fly[index] =
                (
                    Math.random()
                    - 0.5
                ) * 12;
        }
    }


    flyGeometry
        .attributes
        .position
        .needsUpdate = true;


    /* =================================
       ОБЩЕЕ СВЕЧЕНИЕ
    ================================= */

    glow.rotation.z =
        time * 0.03;


    /* =================================
       РЕНДЕР
    ================================= */

    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   ЗАПУСК
===================================================== */

animate();

</script>

</body>
  </html>
